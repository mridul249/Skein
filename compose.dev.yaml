# Development only: a Postgres for running Skein FROM SOURCE.
# To deploy Skein, use compose.yaml. That one runs the server too.
services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: skein-dev-db
    environment:
      POSTGRES_USER: skein
      POSTGRES_PASSWORD: skein
      POSTGRES_DB: skein
    # 5433 on the host, matching SKEIN_DATABASE_URL in .env.example. Bound to
    # 127.0.0.1 so a development database is never exposed off the machine.
    # The container still listens on 5432 internally.
    ports:
      - "127.0.0.1:5433:5432"
    # Its own volume, kept separate from the production stack's skein-pgdata:
    # a `make dev-db-down` wiping a volume must never take real data with it.
    volumes:
      - skein-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skein -d skein"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  skein-dev-pgdata:
