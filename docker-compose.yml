# Development only. Skein deploys as one binary; this file exists so a
# contributor gets a Postgres in one command, not because the product needs
# Compose. Do not use it to deploy.
services:
  postgres:
    image: postgres:16-alpine
    container_name: skein-dev-db
    environment:
      POSTGRES_USER: skein
      POSTGRES_PASSWORD: skein
      POSTGRES_DB: skein
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - skein-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skein -d skein"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  skein-dev-pgdata:
