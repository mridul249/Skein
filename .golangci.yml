version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none

  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - gosec
    - bodyclose
    - nilerr
    - unused

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - (net/http.ResponseWriter).Write

    gosec:
      excludes:
        - G115

    govet:
      disable:
        - fieldalignment

  exclusions:
    generated: lax

    paths:
      - third_party/

    rules:
      - path: ^internal/db/gen/
        linters:
          - errcheck
          - gosec
          - staticcheck
          - unused
          - govet

      - path: .*_test\.go$
        linters:
          - gosec
          - bodyclose
          - contextcheck

formatters:
  enable:
    - gofmt

  exclusions:
    generated: lax