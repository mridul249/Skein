name: Release

# Tag-triggered so a release cannot be forgotten or done inconsistently by
# hand. Everything published here comes from scripts/release-artifacts.sh,
# which is runnable locally: a release must be reproducible off CI, and logic
# that lives only in workflow YAML can be neither run nor tested.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release and upload assets
  packages: write # push the container image to ghcr.io
  id-token: write # cosign keyless signing via OIDC

jobs:
  # The gate runs first and the release depends on it. A tag does not bypass
  # the checks: a signed artifact that was never tested is a trustworthy
  # signature over an untrustworthy binary.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify modules
        run: go mod verify

      - name: Vet, both build configurations
        run: |
          go vet ./...
          go vet -tags desktop ./...

      - name: Test, both build configurations
        run: |
          go test -race -count=1 ./...
          go test -race -tags desktop -count=1 ./...

      - name: Frontend typecheck and tests
        working-directory: web
        env:
          # A release must not be cut on a runner that silently skipped the
          # browser suite. See web/tests/browser/run.mjs.
          REQUIRE_BROWSER_TESTS: "1"
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run test:browser

  release:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed for `git describe` to produce the version the
          # binaries are stamped with.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The frontend is embedded in the binary, so it must exist before the Go
      # build. Without this the release would ship a server that serves
      # nothing, and it would ship silently.
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io, LIKE EVERY OCI REGISTRY, REQUIRES A LOWERCASE REPOSITORY NAME.
      # github.repository preserves the repo's actual casing - "mridul249/Skein"
      # here - which buildx then rejects outright: "repository name must be
      # lowercase". This was invisible until the run that first got past
      # Verify, because every earlier attempt failed or was starved before
      # reaching this step. lower() is a built-in expression function, not a
      # shell command, so this must be computed once as a step output rather
      # than inlined per use - GitHub Actions has no in-template way to
      # lowercase inside a multi-line `tags:` block.
      - name: Compute the lowercase image repository
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # The image carries the same -trimpath / -buildvcs=false flags as the
      # binaries, so what ships in the container is the same build.
      - name: Build and push the image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest


      # SIGN is deliberately NOT set here. The image digest is appended to
      # SHA256SUMS in the next step, so signing inside the script would sign a
      # file that is about to change and the signature would not verify.
      - name: Build artifacts and checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/release-artifacts.sh

      # AFTER the artifact build, because the script wipes dist/ before writing
      # to it. The image is not a file and cannot be checksummed like a binary,
      # so its digest is recorded as a file that IS covered: `docker pull` by
      # digest then gets exactly these bytes or fails.
      - name: Record the image digest and cover it
        run: |
          printf '%s  ghcr.io/%s:%s\n' \
            "${{ steps.image.outputs.digest }}" \
            "${{ steps.repo.outputs.name }}" \
            "${{ github.ref_name }}" > dist/IMAGE_DIGEST.txt
          cat dist/IMAGE_DIGEST.txt
          cd dist && sha256sum IMAGE_DIGEST.txt >> SHA256SUMS

      # Signed only now that SHA256SUMS is final and covers every artifact
      # including the image digest.
      - name: Sign SHA256SUMS
        run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS

      # Belt and braces over the script's own check. The script refuses to
      # produce an incomplete SHA256SUMS; this refuses to PUBLISH one, so a
      # future edit that weakens the script still cannot ship an unchecksummed
      # binary. The rule is that no artifact reaches users unverifiable.
      - name: Refuse to publish an artifact with no checksum
        run: |
          cd dist
          fail=0
          for f in *; do
            case "$f" in
              SHA256SUMS|SHA256SUMS.sig|SHA256SUMS.pem) continue ;;
            esac
            if ! grep -qF "  $f" SHA256SUMS; then
              echo "::error::$f would be published with no checksum"
              fail=1
            fi
          done
          [ -f SHA256SUMS.sig ] || { echo "::error::SHA256SUMS is not signed"; fail=1; }
          exit $fail

      - name: Verify the signature we just made
        run: |
          cosign verify-blob \
            --certificate dist/SHA256SUMS.pem \
            --signature dist/SHA256SUMS.sig \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS

      # And that the checksums describe the bytes actually being uploaded,
      # rather than what they described when they were written.
      - name: Verify checksums against the built files
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Prepended above the auto-generated commit list.
          #
          # PLATFORM SUPPORT IS STATED HERE RATHER THAN ONLY IN THE README
          # because this is what someone reads immediately before downloading.
          # Keep it accurate about which platforms were actually RUN, not which
          # ones merely compiled - the whole point of the block is that binaries
          # published side by side do not automatically have parity.
          body: |
            > ### Platform support
            >
            > **Linux** binaries and the Docker image are tested.
            >
            > **Windows 11** is tested: `skein-desktop-*-windows-amd64.exe` is
            > cross-compiled from Linux, verified GUI-subsystem, and has been
            > run. **Windows 10 is not tested** and needs the
            > [WebView2 runtime](https://developer.microsoft.com/microsoft-edge/webview2/)
            > installed separately. SmartScreen and Defender will both warn,
            > because the binary is unsigned - verify the SHA256 against
            > `SHA256SUMS` before clicking through.
            >
            > **macOS** has no desktop binary; build it with `make desktop`.

            ---
