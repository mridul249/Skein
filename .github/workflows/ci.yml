name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    env:
      CGO_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        run: |
          out=$(gofmt -l . | grep -v '^web/' | grep -v '^third_party/' || true)
          if [ -n "$out" ]; then
            echo "The following files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skein
          POSTGRES_PASSWORD: skein
          POSTGRES_DB: skein_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skein"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CGO_ENABLED: "1"
      SKEIN_TEST_DATABASE_URL: postgres://skein:skein@localhost:5432/skein_test?sslmode=disable
      SKEIN_GOOGLE_CLIENT_ID: ""
      SKEIN_GOOGLE_CLIENT_SECRET: ""
      SKEIN_GOOGLE_REDIRECT_URL: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build ./cmd/skein ./internal/...

      - name: Run tests
        run: go test -race -count=1 ./...

  build:
    name: Build
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    env:
      CGO_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify modules
        run: go mod verify

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Build Skein
        run: |
          mkdir -p bin
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w" \
            -o bin/skein \
            ./cmd/skein

      - name: Report binary size
        run: ls -lh bin/skein

      - uses: actions/upload-artifact@v4
        with:
          name: skein-linux-amd64
          path: bin/skein