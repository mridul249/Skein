name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l . | grep -v '^web/' | grep -v '^third_party/' || true)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.63.4

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skein
          POSTGRES_PASSWORD: skein
          POSTGRES_DB: skein_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skein"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CGO_ENABLED: "1"
      SKEIN_TEST_DATABASE_URL: postgres://skein:skein@localhost:5432/skein_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go build ./cmd/skein ./internal/...
      - run: go test -race -count=1 ./...

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go build -trimpath -ldflags "-s -w" -o bin/skein ./cmd/skein
      - name: Report binary size
        run: ls -lh bin/skein
      - uses: actions/upload-artifact@v4
        with:
          name: skein-linux-amd64
          path: bin/skein